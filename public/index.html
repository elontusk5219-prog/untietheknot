<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解开那束结 RUBEN25/26</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0c;
  --text: #e8e4df;
  --dim: #6b6560;
  --accent: #c4956a;
  --card-bg: #141416;
  --border: #2a2a2e;
  --edit-bg: rgba(196,149,106,0.06);
  --green: #6bbd7a;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
  line-height: 1.8;
  overflow-x: hidden;
}

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(196,149,106,0.08) 0%, transparent 70%);
}

.hero h1 {
  font-size: clamp(2rem, 6vw, 4.5rem);
  font-weight: 700;
  letter-spacing: 0.15em;
  margin-bottom: 0.5em;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  height: 60vh;
  max-height: 500px;
}

.hero .subtitle { font-size: 0.9rem; color: var(--dim); letter-spacing: 0.3em; margin-top: 1em; }
.hero .scroll-hint { position: absolute; bottom: 2rem; color: var(--dim); font-size: 0.75rem; letter-spacing: 0.2em; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

/* Status bar */
.status-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 900;
  padding: 0.4rem 1rem;
  background: rgba(10,10,12,0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.7rem; color: var(--dim);
}

.status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 0.4em; }
.status-dot.on { background: var(--green); }
.status-dot.off { background: #e44; }

.tracklist { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }

.track { margin-bottom: 6rem; border-bottom: 1px solid var(--border); padding-bottom: 4rem; }
.track:last-child { border-bottom: none; }

.track-header { display: flex; align-items: baseline; gap: 1.5rem; margin-bottom: 2rem; }
.track-num { font-size: 3rem; font-weight: 700; color: var(--accent); opacity: 0.5; line-height: 1; }
.track-title { font-size: 1.5rem; font-weight: 700; }
.track-feat { font-size: 0.85rem; color: var(--dim); margin-left: 0.5em; }

/* Editable fields */
[contenteditable] {
  outline: none;
  border-radius: 4px;
  transition: background 0.2s, box-shadow 0.2s;
  padding: 2px 4px;
  margin: -2px -4px;
}

[contenteditable]:hover { background: var(--edit-bg); }
[contenteditable]:focus { background: var(--edit-bg); box-shadow: 0 0 0 1px var(--accent); }

.save-indicator {
  display: inline-block;
  font-size: 0.65rem;
  color: var(--green);
  opacity: 0;
  transition: opacity 0.3s;
  margin-left: 0.5em;
}

.save-indicator.show { opacity: 1; }

/* Player */
.player { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding: 0.8rem 1.2rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; }
.play-btn { width: 36px; height: 36px; border: 2px solid var(--accent); border-radius: 50%; background: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.play-btn:hover { background: rgba(196,149,106,0.15); }
.play-btn svg { width: 14px; height: 14px; fill: currentColor; }
.progress-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
.time-display { font-size: 0.7rem; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Scene & annotation */
.scene-line { font-size: 0.8rem; color: var(--dim); margin-bottom: 1.5rem; letter-spacing: 0.05em; }
.annotation { font-size: 0.85rem; color: var(--dim); line-height: 1.9; max-width: 700px; margin-top: 1.5rem; padding-left: 1rem; border-left: 2px solid var(--border); }

/* Concept art grid */
.concepts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.concept-img { aspect-ratio: 1; overflow: hidden; border-radius: 6px; cursor: grab; position: relative; border: 1px solid var(--border); transition: opacity 0.2s, border-color 0.2s; }
.concept-img.dragging { opacity: 0.4; cursor: grabbing; }
.concept-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; pointer-events: none; }
.concept-img:hover img { transform: scale(1.05); }
.concept-img .label { position: absolute; bottom: 0; left: 0; right: 0; padding: 0.5rem 0.8rem; background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-size: 0.65rem; color: var(--dim); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.concept-img:hover .label { opacity: 1; }

/* Drop zone highlight */
.concepts.drag-over { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 8px; background: rgba(196,149,106,0.05); }
.supp-grid.drag-over { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 8px; background: rgba(196,149,106,0.05); }
.drop-hint { display: none; padding: 2rem; text-align: center; color: var(--accent); font-size: 0.8rem; letter-spacing: 0.05em; border: 1px dashed var(--border); border-radius: 6px; grid-column: 1 / -1; }
.drag-over .drop-hint { display: block; }
.concept-img .remove-btn { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: #e44; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 2; }
.concept-img:hover .remove-btn { display: flex; }

/* Upload area */
.upload-area { margin-top: 1.5rem; }
.upload-btn {
  display: inline-flex; align-items: center; gap: 0.4em;
  padding: 0.5rem 1rem;
  background: none;
  border: 1px dashed var(--dim);
  color: var(--dim);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: inherit;
  transition: border-color 0.2s, color 0.2s;
}
.upload-btn:hover { border-color: var(--accent); color: var(--accent); }

.uploads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; margin-top: 1rem; }
.upload-card { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.upload-card img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; }
.upload-card .caption { padding: 0.4rem 0.6rem; font-size: 0.7rem; color: var(--dim); background: var(--card-bg); }
.upload-card .delete-btn { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: #e44; font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; }
.upload-card:hover .delete-btn { display: flex; }

/* Notes */
.notes-section { margin-top: 2rem; }
.notes-title { font-size: 0.8rem; color: var(--dim); margin-bottom: 0.8rem; }
.note-input-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.note-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.8rem; color: var(--text); font-family: inherit; font-size: 0.8rem; outline: none; }
.note-input:focus { border-color: var(--accent); }
.note-input::placeholder { color: #444; }
.note-send { padding: 0.5rem 1rem; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
.note-send:hover { opacity: 0.85; }
.note-list { list-style: none; }
.note-item { padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.note-item:last-child { border-bottom: none; }
.note-text { flex: 1; color: var(--text); }
.note-meta { font-size: 0.65rem; color: var(--dim); white-space: nowrap; }
.note-del { background: none; border: none; color: #e44; cursor: pointer; font-size: 0.7rem; margin-left: 0.5rem; }

/* Supplementary */
.supplementary { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
.supplementary h2 { font-size: 1.3rem; color: var(--dim); margin-bottom: 2rem; letter-spacing: 0.1em; }
.supp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.8rem; }

/* Shelf - floating clipboard */
.shelf {
  position: fixed;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 800;
  width: 52px;
  transition: width 0.3s ease, background 0.3s;
  background: rgba(20,20,22,0.85);
  backdrop-filter: blur(10px);
  border-right: 1px solid var(--border);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: 0 10px 10px 0;
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  max-height: 70vh;
  overflow-y: auto;
  overflow-x: hidden;
}

.shelf::-webkit-scrollbar { width: 3px; }
.shelf::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.shelf-label {
  writing-mode: vertical-rl;
  font-size: 0.6rem;
  color: var(--dim);
  letter-spacing: 0.15em;
  white-space: nowrap;
  user-select: none;
  padding: 4px 0;
}

.shelf.has-items { width: 90px; }
.shelf.drag-over { border-color: var(--accent); background: rgba(196,149,106,0.1); }

.shelf-item {
  width: 72px;
  height: 72px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: grab;
  position: relative;
  flex-shrink: 0;
  transition: border-color 0.2s;
}
.shelf-item:hover { border-color: var(--accent); }
.shelf-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.shelf-item .shelf-rm {
  position: absolute; top: 2px; right: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: rgba(0,0,0,0.8); color: #e44;
  font-size: 10px; border: none; cursor: pointer;
  display: none; align-items: center; justify-content: center;
}
.shelf-item:hover .shelf-rm { display: flex; }

.shelf-empty {
  width: 40px; height: 40px;
  border: 1px dashed var(--dim);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--dim);
  font-size: 16px;
  opacity: 0.5;
}

.shelf.has-items .shelf-empty { display: none; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; cursor: zoom-out; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; }

.footer { text-align: center; padding: 3rem 1.5rem; color: var(--dim); font-size: 0.75rem; letter-spacing: 0.15em; border-top: 1px solid var(--border); }

@media (max-width: 600px) {
  .track-header { flex-direction: column; gap: 0.5rem; }
  .track-num { font-size: 2rem; }
  .track-title { font-size: 1.2rem; }
  .concepts { grid-template-columns: repeat(2, 1fr); }
  .uploads-grid { grid-template-columns: repeat(2, 1fr); }
  .hero h1 { height: 45vh; }
  .status-bar { font-size: 0.6rem; }
  .shelf { width: 44px; max-height: 50vh; }
  .shelf.has-items { width: 70px; }
  .shelf-item { width: 56px; height: 56px; }
  .shelf-label { font-size: 0.5rem; }
}
</style>
</head>

<script>
const TRACKS = [
  { num:'01', title:'解开那束结', feat:'', images:['t01_jiekai_v1_gpt2.png','t01b_jiekai_gpt2.png','t01c_jiekai_gpt2.png','t01d_jiekai_gpt2.png'], scene:'', annotation:'' },

  { num:'04', title:'象形文字', feat:'', images:['t04_hieroglyph_v1_gpt2.png','t04b_hieroglyph_gpt2.png','t04c_hieroglyph_gpt2.png','t04d_hieroglyph_gpt2.png'], scene:'', annotation:'' },
  { num:'05', title:'捕风捉影', feat:'feat. 马马魚子', images:['t05_catch_wind_v1_gpt2.png','t05b_catch_wind_gpt2.png','t05c_catch_wind_gpt2.png','t05d_catch_wind_gpt2.png'], scene:'', annotation:'' },

  { num:'07', title:'新咒语', feat:'', images:['t07_spell_v1_gpt2.png','t07b_spell_gpt2.png','t07c_spell_gpt2.png','t07d_spell_gpt2.png'], scene:'', annotation:'' },
  { num:'08', title:'吉卜力音乐', feat:'未完成demo', images:['t08_ghibli_v1_gpt2.png','t08b_ghibli_gpt2.png','t08c_ghibli_gpt2.png','t08d_ghibli_gpt2.png'], scene:'', annotation:'' },
  { num:'09', title:'销声匿迹', feat:'feat. hpsb & jackzebra', images:['t09_vanish_v1_gpt2.png','t09b_vanish_gpt2.png','t09c_vanish_gpt2.png','t09d_vanish_gpt2.png'], scene:'', annotation:'' },
  { num:'10', title:'Dream Big (做大梦)', feat:'', images:['t10_dream_v1_gpt2.png','t10b_dream_gpt2.png','t10c_dream_gpt2.png','t10d_dream_gpt2.png'], scene:'', annotation:'' },

  { num:'12', title:'看完花火再回', feat:'', images:['t12_fireworks_v1_gpt2.png','t12b_fireworks_gpt2.png','t12c_fireworks_gpt2.png','t12d_fireworks_gpt2.png'], scene:'', annotation:'' },

const AUDIO_MAP = {
  '01':'解开那束结.mp3','02':'Flight To Paris (直飞巴黎).mp3','03':'蜂蜜 (feat. jolae & Jeriyaki).mp3',
  '04':'象形文字.mp3','05':'捕风捉影 (feat. 马马魚子).mp3','06':'得到你的爱 (feat. LimboLimbs & G3GE).mp3',
  '07':'新咒语.mp3','08':'吉卜力音乐.mp3','09':'销声匿迹 (feat. hpsb & jackzebra).mp3',
  '10':'Dream Big (做大梦).mp3','11':'你跳着舞 我唱着歌.mp3','12':'看完花火再回.mp3'
};

const SUPP = {
  storyboard: ['06_shot_A_wide_v1_gpt2.png','06_shot_A_wide_v2_gpt2.png','06_shot_A_wide_v3_gpt2.png','06_shot_A_wide_v4_gpt2.png','07_shot_B_crying_v1_gpt2.png','07_shot_B_crying_v2_gpt2.png','07_shot_B_crying_v3_gpt2.png','08_shot_C_plane_v1_gpt2.png','08_shot_C_plane_v2_gpt2.png','08_shot_C_plane_v3_gpt2.png','08_shot_C_plane_v4_gpt2.png','08_shot_C_plane_v5_gpt2.png','09_shot_D_phone_v1_gpt2.png','09_shot_D_phone_v2_gpt2.png','09_shot_D_phone_v3_gpt2.png','10_shot_E_wipe_v1_gpt2.png','10_shot_E_wipe_v2_gpt2.png','10_shot_E_wipe_v3_gpt2.png','11_puddle_reflection_v1_gpt2.png','12_overpass_v1_gpt2.png','13_night_streetlight_v1_gpt2.png','14_hair_closeup_v1_gpt2.png','15_hands_waist_v1_gpt2.png','16_intersection_v1_gpt2.png','17_from_behind_close_v1_gpt2.png','18_scarf_wind_v1_gpt2.png'],

};

// --- STATE ---
let siteData = {};
let connected = false;
let saveTimer = null;

// --- API ---
async function loadData() {
  try {
    const res = await fetch('/api/data');
    if (res.ok) {
      siteData = await res.json();
      connected = true;
    }
  } catch(e) {
    // fallback to localStorage
    siteData = JSON.parse(localStorage.getItem('site_data') || '{}');
  }
  updateStatus();
  applyData();
}

async function saveData(partial) {
  Object.assign(siteData, partial);
  localStorage.setItem('site_data', JSON.stringify(siteData));

  if (connected) {
    try {
      await fetch('/api/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(partial)
      });
      showSaved();
    } catch(e) { console.warn('save failed', e); }
  } else {
    showSaved();
  }
}

function updateStatus() {
  document.getElementById('dot').className = 'status-dot ' + (connected ? 'on' : 'off');
  document.getElementById('status-text').textContent = connected ? '已连接 · 共享模式' : '离线 · 本地模式';
}

function showSaved() {
  document.getElementById('last-save').textContent = '已保存 ' + new Date().toLocaleTimeString();
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

const debouncedSave = debounce((key, val) => {
  saveData({ [key]: val });
}, 800);

// --- RENDER ---
const tracklist = document.getElementById('tracklist');
let currentAudio = null, currentBtn = null;

TRACKS.forEach(t => {

  div.className = 'track';
  div.id = `track-${t.num}`;
  div.innerHTML = `
    <div class="track-header">
      <span class="track-num">${t.num}</span>
      <span class="track-title">${t.title}</span>
      ${t.feat ? `<span class="track-feat">${t.feat}</span>` : ''}
    </div>
    <div class="player">
      <button class="play-btn" data-src="audio/${t.num}_${encodeURIComponent(AUDIO_MAP[t.num])}">
        <svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>
      </button>
      <div class="progress-wrap"><div class="progress-bar"></div></div>
      <span class="time-display">0:00 / --:--</span>
    </div>
    <div class="scene-line" contenteditable="true" data-field="scene_${t.num}" placeholder="点击写场景描述..."></div>
    <div class="concepts" data-drop-target="track-${t.num}">
      ${t.images.map(img => `
        <div class="concept-img" draggable="true" data-full="images/${img}" data-thumb="images/${img.replace('.png','.webp')}" data-origin="track-${t.num}">
          <img src="images/${img.replace('.png','.webp')}" alt="${t.title}" loading="lazy">
          <div class="label">${img.replace('_gpt2.png','').replace(/_/g,' ')}</div>
          <button class="remove-btn" onclick="event.stopPropagation();removeImage(this.closest('.concept-img'))">×</button>
        </div>
      `).join('')}
      <div class="drop-hint">拖放图片到这里</div>
    </div>
    <div class="upload-area" data-track="${t.num}">
      <div class="uploads-grid" id="uploads-${t.num}"></div>
      <button class="upload-btn" onclick="triggerUpload('${t.num}')">+ 上传参考图</button>
      <input type="file" id="file-${t.num}" accept="image/*" multiple style="display:none" onchange="handleUpload('${t.num}', this.files)">
    </div>
    <div class="annotation" contenteditable="true" data-field="note_${t.num}" placeholder="点击写备注..."></div>
    <div class="notes-section">
      <div class="notes-title">讨论</div>
      <div class="note-input-row">
        <input class="note-input" id="input-${t.num}" placeholder="写点什么..." onkeydown="if(event.key==='Enter'){addNote('${t.num}');event.preventDefault();}">
        <button class="note-send" onclick="addNote('${t.num}')">发送</button>
      </div>
      <ul class="note-list" id="notes-${t.num}"></ul>
    </div>
  `;
  tracklist.appendChild(div);
});

// Supplementary grids
Object.entries(SUPP).forEach(([key, imgs]) => {
  const grid = document.getElementById(`grid-${key}`);
  if (!grid) return;
  grid.dataset.dropTarget = `supp-${key}`;
  imgs.forEach(img => {
    const d = document.createElement('div');
    d.className = 'concept-img';
    d.draggable = true;
    d.dataset.full = `images/${img}`;
    d.dataset.thumb = `images/${img.replace('.png','.webp')}`;
    d.dataset.origin = `supp-${key}`;
    d.innerHTML = `<img src="images/${img.replace('.png','.webp')}" alt="${img}" loading="lazy"><div class="label">${img.replace('_gpt2.png','').replace(/_/g,' ')}</div><button class="remove-btn" onclick="event.stopPropagation();removeImage(this.closest('.concept-img'))">×</button>`;
    grid.appendChild(d);
  });
  const hint = document.createElement('div');
  hint.className = 'drop-hint';
  hint.textContent = '拖放图片到这里';
  grid.appendChild(hint);
});

// --- EDITABLE TEXT ---
document.querySelectorAll('[contenteditable]').forEach(el => {
  const field = el.dataset.field;
  if (!field) return;

  // placeholder behavior
  el.addEventListener('focus', () => {
    if (el.textContent.trim() === '' || el.textContent === el.getAttribute('placeholder')) {
      el.textContent = '';
      el.style.color = '';
    }
  });

  el.addEventListener('blur', () => {
    if (el.textContent.trim() === '') {
      el.textContent = el.getAttribute('placeholder') || '';
      el.style.color = '#333';
    }
  });

  el.addEventListener('input', () => {
    debouncedSave(field, el.textContent.trim());
  });
});

function applyData() {
  document.querySelectorAll('[contenteditable]').forEach(el => {
    const field = el.dataset.field;
    if (!field) return;
    const val = siteData[field];
    if (val) {
      el.textContent = val;
      el.style.color = '';
    } else {
      el.textContent = el.getAttribute('placeholder') || '';
      el.style.color = '#333';
    }
  });

  // render uploads, notes, and image arrangements
  TRACKS.forEach(t => {
    renderUploads(t.num);
    renderNotes(t.num);
  });
  applyArrangements();
}

// --- IMAGE UPLOAD ---
function triggerUpload(num) {
  document.getElementById(`file-${num}`).click();
}

async function handleUpload(num, files) {
  for (const file of files) {
    const base64 = await resizeAndEncode(file, 600);
    const key = `uploads_${num}`;
    const uploads = siteData[key] || [];
    uploads.push({ data: base64, name: file.name, time: Date.now() });
    await saveData({ [key]: uploads });
    renderUploads(num);
  }
}

function resizeAndEncode(file, maxSize) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/webp', 0.7));
    };
    img.src = URL.createObjectURL(file);
  });
}

function renderUploads(num) {
  const container = document.getElementById(`uploads-${num}`);
  const uploads = siteData[`uploads_${num}`] || [];
  container.innerHTML = uploads.map((u, i) => `
    <div class="upload-card">
      <img src="${u.data}" alt="${u.name}" onclick="openLightbox('${u.data}')">
      <div class="caption">${u.name}</div>
      <button class="delete-btn" onclick="deleteUpload('${num}',${i})">×</button>
    </div>
  `).join('');
}

function deleteUpload(num, idx) {
  const key = `uploads_${num}`;
  const uploads = siteData[key] || [];
  uploads.splice(idx, 1);
  saveData({ [key]: uploads });
  renderUploads(num);
}

// --- NOTES ---
function addNote(num) {
  const input = document.getElementById(`input-${num}`);
  const text = input.value.trim();
  if (!text) return;

  const key = `notes_${num}`;
  const notes = siteData[key] || [];
  notes.push({ text, time: Date.now() });
  saveData({ [key]: notes });
  renderNotes(num);
  input.value = '';
}

function renderNotes(num) {
  const list = document.getElementById(`notes-${num}`);
  const notes = siteData[`notes_${num}`] || [];
  list.innerHTML = notes.map((n, i) => `
    <li class="note-item">
      <span class="note-text">${escHtml(n.text)}</span>
      <span class="note-meta">${new Date(n.time).toLocaleString()}<button class="note-del" onclick="deleteNote('${num}',${i})">删除</button></span>
    </li>
  `).join('');
}

function deleteNote(num, idx) {
  const key = `notes_${num}`;
  const notes = siteData[key] || [];
  notes.splice(idx, 1);
  saveData({ [key]: notes });
  renderNotes(num);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// --- AUDIO PLAYER ---
document.querySelectorAll('.play-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const src = decodeURIComponent(btn.dataset.src);
    const player = btn.closest('.player');
    const bar = player.querySelector('.progress-bar');
    const time = player.querySelector('.time-display');

    if (currentAudio && currentBtn === btn) {
      if (currentAudio.paused) { currentAudio.play(); btn.innerHTML = pauseIcon(); }
      else { currentAudio.pause(); btn.innerHTML = playIcon(); }
      return;
    }

    if (currentAudio) { currentAudio.pause(); if (currentBtn) currentBtn.innerHTML = playIcon(); }
    currentAudio = new Audio(src);
    currentBtn = btn;
    currentAudio.play();
    btn.innerHTML = pauseIcon();

    currentAudio.addEventListener('timeupdate', () => {
      bar.style.width = (currentAudio.currentTime / currentAudio.duration * 100) + '%';
      time.textContent = `${fmt(currentAudio.currentTime)} / ${fmt(currentAudio.duration)}`;
    });
    currentAudio.addEventListener('ended', () => { btn.innerHTML = playIcon(); bar.style.width = '0%'; });

    player.querySelector('.progress-wrap').onclick = e => {
      if (!currentAudio || currentBtn !== btn) return;
      const r = e.currentTarget.getBoundingClientRect();
      currentAudio.currentTime = ((e.clientX - r.left) / r.width) * currentAudio.duration;
    };
  });
});

function playIcon() { return '<svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg>'; }
function pauseIcon() { return '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/></svg>'; }
function fmt(s) { if (!s || isNaN(s)) return '--:--'; return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }

// --- LIGHTBOX ---
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
}

let dragHappened = false;
document.addEventListener('dragstart', () => { dragHappened = true; }, true);
document.addEventListener('click', e => {
  if (dragHappened) { dragHappened = false; return; }
  const card = e.target.closest('.concept-img');
  if (card && !e.target.closest('.upload-card') && !e.target.closest('.remove-btn')) openLightbox(card.dataset.full);
});

document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('active');
  document.getElementById('lightbox-img').src = '';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('active'); }
});

// --- DRAG & DROP ---
let dragData = null;
const shelf = document.getElementById('shelf');

document.addEventListener('dragstart', e => {
  const card = e.target.closest('.concept-img') || e.target.closest('.shelf-item');
  if (!card) return;
  card.classList.add('dragging');

  const isShelfItem = card.classList.contains('shelf-item');
  dragData = {
    full: card.dataset.full,
    thumb: card.dataset.thumb,
    label: card.dataset.label || card.querySelector('.label')?.textContent || '',
    origin: isShelfItem ? 'shelf' : card.dataset.origin,
    el: card
  };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
});

document.addEventListener('dragend', e => {
  const card = e.target.closest('.concept-img') || e.target.closest('.shelf-item');
  if (card) card.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  shelf.classList.remove('drag-over');
  dragData = null;
});

document.addEventListener('dragover', e => {
  if (!dragData) return;

  // Check shelf
  if (e.target.closest('#shelf')) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    shelf.classList.add('drag-over');
    return;
  }

  // Check grid zones
  const grid = e.target.closest('[data-drop-target]');
  if (!grid) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  shelf.classList.remove('drag-over');
  grid.classList.add('drag-over');
});

document.addEventListener('dragleave', e => {
  // Shelf leave
  if (e.target.closest('#shelf') && !e.relatedTarget?.closest('#shelf')) {
    shelf.classList.remove('drag-over');
  }
  // Grid leave
  const grid = e.target.closest('[data-drop-target]');
  if (!grid) return;
  const related = e.relatedTarget?.closest('[data-drop-target]');
  if (related !== grid) grid.classList.remove('drag-over');
});

document.addEventListener('drop', e => {
  e.preventDefault();
  if (!dragData) return;

  // Drop onto shelf
  if (e.target.closest('#shelf')) {
    shelf.classList.remove('drag-over');
    if (dragData.origin === 'shelf') return; // already on shelf

    addToShelf(dragData.full, dragData.thumb, dragData.label);
    dragData.el.remove();

    // Save source arrangement
    if (dragData.origin !== 'shelf') {
      saveArrangement(dragData.origin);
    }
    return;
  }

  // Drop onto grid zone
  const grid = e.target.closest('[data-drop-target]');
  if (!grid) return;
  grid.classList.remove('drag-over');

  const targetZone = grid.dataset.dropTarget;
  if (targetZone === dragData.origin) return;

  // Create new image card in target
  const card = document.createElement('div');
  card.className = 'concept-img';
  card.draggable = true;
  card.dataset.full = dragData.full;
  card.dataset.thumb = dragData.thumb;
  card.dataset.origin = targetZone;
  card.innerHTML = `<img src="${dragData.thumb}" alt="" loading="lazy"><div class="label">${dragData.label}</div><button class="remove-btn" onclick="event.stopPropagation();removeImage(this.closest('.concept-img'))">×</button>`;
  const hint = grid.querySelector('.drop-hint');
  grid.insertBefore(card, hint);

  // Remove from source
  dragData.el.remove();

  // Save arrangements
  if (dragData.origin !== 'shelf') {
    saveArrangement(dragData.origin);
  }
  saveArrangement(targetZone);
  updateShelfState();
});

// --- SHELF ---
function addToShelf(full, thumb, label) {
  const item = document.createElement('div');
  item.className = 'shelf-item';
  item.draggable = true;
  item.dataset.full = full;
  item.dataset.thumb = thumb;
  item.dataset.label = label;
  item.innerHTML = `<img src="${thumb}" alt="${label}"><button class="shelf-rm" onclick="event.stopPropagation();this.parentElement.remove();updateShelfState();">×</button>`;
  item.addEventListener('click', e => {
    if (!e.target.closest('.shelf-rm')) openLightbox(full);
  });
  shelf.insertBefore(item, shelf.querySelector('.shelf-empty'));
  updateShelfState();
}

function updateShelfState() {
  const hasItems = shelf.querySelectorAll('.shelf-item').length > 0;
  shelf.classList.toggle('has-items', hasItems);
}

function removeImage(card) {
  const zone = card.closest('[data-drop-target]')?.dataset.dropTarget;
  card.remove();
  if (zone) saveArrangement(zone);
}

function saveArrangement(zoneId) {
  const grid = document.querySelector(`[data-drop-target="${zoneId}"]`);
  if (!grid) return;
  const images = [...grid.querySelectorAll('.concept-img')].map(c => ({
    full: c.dataset.full,
    thumb: c.dataset.thumb,
    label: c.querySelector('.label')?.textContent || ''
  }));
  debouncedSave(`arrangement_${zoneId}`, images);
}

function applyArrangements() {
  document.querySelectorAll('[data-drop-target]').forEach(grid => {
    const zoneId = grid.dataset.dropTarget;
    const arr = siteData[`arrangement_${zoneId}`];
    if (!arr || !Array.isArray(arr)) return;

    // Remove existing concept-imgs, keep the drop hint
    grid.querySelectorAll('.concept-img').forEach(c => c.remove());
    const hint = grid.querySelector('.drop-hint');

    arr.forEach(item => {
      const card = document.createElement('div');
      card.className = 'concept-img';
      card.draggable = true;
      card.dataset.full = item.full;
      card.dataset.thumb = item.thumb;
      card.dataset.origin = zoneId;
      card.innerHTML = `<img src="${item.thumb}" alt="" loading="lazy"><div class="label">${item.label}</div><button class="remove-btn" onclick="event.stopPropagation();removeImage(this.closest('.concept-img'))">×</button>`;
      grid.insertBefore(card, hint);
    });
  });
}

// --- POLL FOR CHANGES (every 30s) ---
setInterval(async () => {
  if (!connected) return;
  try {
    const res = await fetch('/api/data');
    if (res.ok) {
      const fresh = await res.json();
      if (JSON.stringify(fresh) !== JSON.stringify(siteData)) {
        siteData = fresh;
        applyData();
      }
    }
  } catch(e) {}
}, 30000);

// --- INIT ---
loadData();
</script>
